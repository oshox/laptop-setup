# Selects the custom "Sway-Fedora" greeter theme shipped at
# /usr/share/sddm/themes/custom-theme (see theme.conf for its own background).
#
# Autologin is explicitly disabled here. There is no rpm-ostree/anaconda
# default to worry about overriding, but this is left in place, and
# uncommented, as a deliberate marker: if anyone is ever tempted to add an
# [Autologin] User= line back (e.g. by copying 01-sddm-theme.conf from the
# old laptop), this file makes it obvious autologin was turned off on purpose.
[Autologin]
Session=
User=

[Theme]
Current=custom-theme
