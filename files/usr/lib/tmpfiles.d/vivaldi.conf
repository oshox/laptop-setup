# /opt is a symlink to /var/opt in bootc images, and /var content baked into
# an image is not what gets used at runtime (it's populated from /usr on
# first boot / reset). Vivaldi's RPM installs to /opt/vivaldi, so the
# Containerfile relocates the real payload to /usr/lib/opt/vivaldi at build
# time and this rule recreates /var/opt/vivaldi -> /usr/lib/opt/vivaldi on
# every boot, the same way rpm-ostree's /opt handling works on this laptop.
# L+ (not L): if a real /var/opt/vivaldi directory exists (e.g. left by the
# RPM's codec downloader), plain L silently skips and Vivaldi can't launch.
L+ /var/opt/vivaldi - - - - /usr/lib/opt/vivaldi
