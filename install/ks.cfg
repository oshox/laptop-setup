#version=RHEL9
# Kickstart for installing the laptop-setup bootc image onto the LG gram 16
# (16Z90TS-G.AUG7U1) from a Fedora 44 Everything netinstall ISO.
#
# WIPES BOTH INTERNAL SSDS, INCLUDING WINDOWS. Back up anything you want to
# keep off the machine first.
#
# There is deliberately no `rootpw` and no `user` line: Anaconda will stop
# and interactively prompt for a *temporary* root password at install time.
# That account is used only for the first-boot steps in
# ../migrate/FIRST-BOOT.md and is locked (`passwd -l root`) there. The only
# real account is the systemd-homed user created in that same doc — there
# is no classic /etc/passwd home directory for it at all.
#
# Before using this file: boot the installer once, drop to a shell
# (Ctrl+Alt+F2) and run `lsblk` to confirm the two NVMe SSDs really are
# nvme0n1 (OS) and nvme1n1 (homes) on this machine. Fix the --ondisk /
# --drives values below if not.
#
# Networking: this machine has no wired Ethernet available at install time,
# only Wi-Fi. Dracut's very-early boot-time networking (what a kernel
# cmdline `ip=`/`essid=` boot option would drive) has no wireless support
# at all, so that's deliberately not attempted here. Anaconda's own
# environment, once it's fully up, has full Wi-Fi support through its
# normal interactive network screen though — and that's the one that
# actually matters, since it's what's live when this kickstart's
# `ostreecontainer` line needs to fetch the image. Leaving `network` below
# to just set the hostname (no --device/--activate) means Anaconda won't
# try to force-activate a wired link that doesn't exist; instead it pauses
# at the Installation Summary screen with "Network & Host Name" flagged as
# unconfigured. Connect to Wi-Fi there (or via `nmtui`/`nmcli device wifi
# connect <SSID> password <pass>` from a shell, Ctrl+Alt+F2) before
# clicking "Begin Installation" — this also means your Wi-Fi password
# never has to be written into this file.

lang en_US.UTF-8
keyboard us
timezone Etc/UTC --utc

network --hostname=gram16

firstboot --disable
eula --agreed

# Secure Boot stays ON (this machine's default) — do not add `--nombr` or
# disable it here. See migrate/FIRST-BOOT.md step 5 for MOK enrollment.

ignoredisk --only-use=nvme0n1,nvme1n1
zerombr
clearpart --all --initlabel --disklabel=gpt --drives=nvme0n1,nvme1n1

# --- SSD 1 (nvme0n1): the OS. NOT encrypted — bootc/ostree content is
# reproducible from the image, so there is nothing on this disk worth
# encrypting once the home directory (SSD 2) is.
part /boot/efi --fstype=efi  --size=600  --ondisk=nvme0n1
part /boot     --fstype=ext4 --size=1024 --ondisk=nvme0n1
part btrfs.01  --fstype=btrfs --grow     --ondisk=nvme0n1
btrfs none --label=fedora btrfs.01
btrfs / --subvol --name=root LABEL=fedora

# --- SSD 2 (nvme1n1): home directories. Plain ext4 on the outside; each
# user's home is a LUKS2-encrypted disk image *file* living inside it,
# created by `homectl create --storage=luks` in FIRST-BOOT.md step 3 (not
# by this kickstart — systemd-homed manages its own encryption).
part /home --fstype=ext4 --grow --ondisk=nvme1n1 --label=homes

ostreecontainer --url=ghcr.io/oshox/laptop-setup:latest --transport=registry --no-signature-verification

%post --erroronfail
# Rootless podman/k3d subuid+subgid range, matching the source laptop.
echo 'oshox:524288:65536' >> /etc/subuid
echo 'oshox:524288:65536' >> /etc/subgid
%end

reboot
